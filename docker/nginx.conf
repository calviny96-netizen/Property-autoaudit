server {
    listen 80;
    server_name _;
    client_max_body_size 0;

    # Lists and statistics are JSON; the UI service already compresses its own files.
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types application/json text/csv;

    location /api/ {
        proxy_pass http://xm-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://xm-ui:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
