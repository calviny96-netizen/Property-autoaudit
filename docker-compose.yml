name: xm

services:
  postgres:
    image: postgres:16
    container_name: postgres-manusai
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant-rag
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage

  xm-api:
    build: ./api
    container_name: xm-api
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_HOST: postgres-manusai
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      QDRANT_URL: http://qdrant-rag:6333
      QDRANT_COLLECTION: xm_rag
      UPLOAD_DIR: /data/uploads
      XM_EXPORT_DIR: /data/export-parts
      XM_INTEGRATION_EXPORT_DIR: /data/integration-exports
      XM_INTEGRATION_EXPORT_DAYS: ${XM_INTEGRATION_EXPORT_DAYS:-7}
      XM_PUBLIC_URL: ${XM_PUBLIC_URL:-https://property.dbautoaudit.stream}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/xm:/data
      - ./public:/assets:ro

  xm-worker:
    build: ./api
    container_name: xm-worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    env_file:
      - path: ./.env
        required: false
    environment:
      DATABASE_HOST: postgres-manusai
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      QDRANT_URL: http://qdrant-rag:6333
      QDRANT_COLLECTION: xm_rag
      UPLOAD_DIR: /data/uploads
      XM_EXPORT_DIR: /data/export-parts
      XM_INTEGRATION_EXPORT_DIR: /data/integration-exports
      XM_INTEGRATION_EXPORT_DAYS: ${XM_INTEGRATION_EXPORT_DAYS:-7}
      XM_PG_WORK_MEM: ${XM_PG_WORK_MEM:-256MB}
      XM_PG_SYNCHRONOUS_COMMIT: ${XM_PG_SYNCHRONOUS_COMMIT:-off}
      XM_PUBLIC_URL: ${XM_PUBLIC_URL:-https://property.dbautoaudit.stream}
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./data/xm:/data
      - ./public:/assets:ro

  xm-ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: xm-ui
    restart: unless-stopped
    depends_on:
      - xm-api

  xm-web:
    image: nginx:1.27-alpine
    container_name: xm-web
    restart: unless-stopped
    depends_on:
      - xm-ui
      - xm-api
    ports:
      - 127.0.0.1:9004:80
      - 127.0.0.1:9046:80
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  xm-hermes:
    image: nousresearch/hermes-agent:latest
    container_name: xm-hermes
    restart: unless-stopped
    command: gateway run
    depends_on:
      - xm-api
    ports:
      - 127.0.0.1:9002:8642
    volumes:
      - ./data/hermes:/opt/data
      - ./hermes-skills/xm-property-matchmaker:/opt/data/skills/xm-property-matchmaker:ro
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      HERMES_DASHBOARD: "0"
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
